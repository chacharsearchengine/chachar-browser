<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chachar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎩</text></svg>">
<style>
:root{--W:min(300px,70vw)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#202124;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
h1{font-size:clamp(46px,13vw,80px);margin:0 0 4px;letter-spacing:-2px}
.sub{color:#5f6368;margin:0 0 10px;font-size:14px}
#stage{position:relative;width:var(--W);height:calc(var(--W)*1.24)}
#stage img{position:absolute;bottom:0;left:0;width:100%;cursor:pointer;user-select:none;-webkit-user-drag:none}
#stage img.hide{opacity:0;pointer-events:none}
#bar{position:relative;z-index:2;width:min(580px,94vw);margin-top:calc(var(--W)*-.17);display:flex;align-items:center;border:1px solid #dfe1e5;border-radius:26px;background:#fff;box-shadow:0 2px 10px rgba(32,33,36,.3);padding:0 6px 0 20px}
#q{flex:1;min-width:0;border:0;outline:0;font-size:17px;height:50px;background:transparent}
#s{border:0;background:none;cursor:pointer;padding:8px;display:flex}
.btns{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.b{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;padding:10px 16px;color:#3c4043;font-size:14px;cursor:pointer}
.b:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
#warn{margin-top:14px;font-size:13px;color:#d93025;font-weight:700}
#tip{margin-top:6px;font-size:14px;color:#188038;min-height:20px;text-align:center}
#ov{position:fixed;inset:0;background:rgba(200,20,20,.93);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9;padding:20px}
#t1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(40px,12vw,110px);margin:0;line-height:1}
#t2{font-size:clamp(16px,4vw,26px);margin:14px 0 0}
#cd{font-size:80px;font-weight:700}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-10px)}80%{transform:translateX(8px)}}
.shake{animation:sh .5s}
footer{margin-top:24px;font-size:12px;color:#70757a;text-align:center}
</style>
</head>

const load=(f,fn)=>{try{fetch(f).then(r=>r.ok?r.text():"").then(fn).catch(()=>{})}catch(e){}};
load("words.txt",t=>addWords(RU,t,1));load("allowed.txt",t=>addWords(ALLOW,t,0));load("english.txt",t=>addWords(ENG,t,0));
const FIX={u:"you",ur:"your",r:"are",pls:"please",plz:"please",wat:"what",wen:"when",cuz:"because",bcz:"because",gonna:"going to",wanna:"want to",idk:"I don’t know",thx:"thanks",hw:"how",wht:"what",tht:"that",abt:"about",dnt:"don’t",i:"I"};
const LINES=["This is an English-only search engine.","Gentleman, I did not hear English.","Disappointed. Very disappointed.","Say it properly, then search.","No Urdu. No shortcuts."];
const PH=["Speak English, search later","Say it properly","Gentleman, type in English","No Urdu. No shortcuts."];
let softOk="",strikes=0,locked=false,busy=false,voice=null,hold=null,pi=0;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>/Daniel|Google UK English Male|Guy|David|Mark|Ryan|Alex/i.test(x.name))||v[0]||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,p,r){if(!("speechSynthesis" in window))return;try{const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="en-GB";u.pitch=p;u.rate=r;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shake(){const s=$("stage");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake")}
function react(on){$("f1").classList.toggle("hide",on);$("f2").classList.toggle("hide",!on);if(on)shake()}
function warn(){$("warn").textContent="Warnings: "+strikes+" / 3"}
function closeOv(){$("ov").style.display="none";react(false)}
function caught(){
 strikes++;warn();react(true);
 if(strikes>=3)return lock();
 $("t1").textContent="TALK IN ENGLISH!";
 $("t2").textContent=(strikes==2?"Second warning, gentleman. ":"")+LINES[Math.floor(Math.random()*LINES.length)];
 $("cd").textContent="";$("ov").style.display="flex";
 say("Talk in English!",.6,.9);
 clearTimeout(hold);hold=setTimeout(closeOv,2600)}
function lock(){
 locked=true;$("q").disabled=true;let n=10;
 $("t1").textContent="GENTLEMAN!";$("t2").textContent="Go and think about what you did.";$("cd").textContent=n;$("ov").style.display="flex";
 say("Gentleman! Go and think about what you did.",.5,.8);
 const iv=setInterval(()=>{n--;$("cd").textContent=n;if(n<=0){clearInterval(iv);locked=false;strikes=0;$("q").disabled=false;$("q").value="";warn();closeOv();$("q").focus()}},1000)}
function known(w){const b=w.replace(/'s$/,"");if(ENG.has(b))return true;
 for(const x of ["s","es","ed","d","ing","ly","er","est"])if(b.length>x.length+2&&b.endsWith(x)){const r=b.slice(0,-x.length);if(ENG.has(r)||ENG.has(r+"e")||(r.length>3&&r.at(-1)===r.at(-2)&&ENG.has(r.slice(0,-1))))return true}
 return false}
function check(q){
 if(URDU.test(q))return{bad:1};
 const toks=(q.match(/[A-Za-z']+/g)||[]).map(t=>t.toLowerCase());
 if(toks.some(t=>RU.has(norm(t))))return{bad:1};
 if(toks.filter(t=>WEAK.has(norm(t))).length>=2)return{bad:1};
 if(ENG.size){
  const c=q.split(/\s+/).filter((t,i)=>/^[A-Za-z']{2,}$/.test(t)&&!(i>0&&/^[A-Z][a-z]+$/.test(t))&&!/^[A-Z]{2,}$/.test(t)).map(t=>t.toLowerCase());
  if(c.length>=3){const u=c.filter(w=>!ALLOW.has(w)&&!known(w)&&!known(norm(w))).length/c.length;if(u>=.85)return{bad:1};if(u>=.6)return{soft:1}}}
 let ch=0;
 const out=q.replace(/[A-Za-z']+/g,m=>{if(FIX[m]&&m===m.toLowerCase()){ch=1;return FIX[m]}return m});
 return{bad:0,fix:ch?out:null}}
function go(lucky){
 if(locked||busy)return;
 const q=$("q").value.trim();
 if(!q){$("tip").textContent="Type something, gentleman.";return}
 $("tip").textContent="";
 const r=check(q);
 if(r.bad)return caught();
 if(r.soft&&softOk!==q){softOk=q;$("tip").textContent="Hmm, is that English, gentleman? Press search again to confirm.";return}
 const run=t=>{location.href="https://www.google.com/search?"+(lucky?"btnI=1&":"")+"q="+encodeURIComponent(t)};
 if(r.fix){busy=true;$("tip").textContent="Did you mean: “"+r.fix+"”? Fixing your English…";$("q").value=r.fix;say("Did you mean, "+r.fix+"?",.8,.95);setTimeout(()=>{busy=false;run(r.fix)},2400);return}
 run(q)}
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
$("s").onclick=()=>go();$("s2").onclick=()=>go();$("l").onclick=()=>go(true);
$("stage").onclick=()=>{shake();say("Gentleman!",.5,.8)};
$("ov").onclick=()=>{if(!locked){clearTimeout(hold);closeOv()}};
$("q").placeholder=PH[0];
setInterval(()=>{pi=(pi+1)%PH.length;$("q").placeholder=PH[pi]},3000);
